blueprint:
  name: ZHA TS004F Dial
  description: >
    Control a light using a Zigbee dial.
    Single press toggles the light.
    Double press runs a custom action.
    Rotate adjusts brightness.
    Supports TS004F dials that emit:
    - remote_button_short_press
    - remote_button_double_press
    - left
    - right
    Tested with ZHA.

  domain: automation

  input:

    remote:
      name: Zigbee Dial
      selector:
        device:
          integration: zha
          model: TS004F

    light:
      name: Light(s)
      selector:
        entity:
          domain: light

    brightness_step:
      name: Brightness Step %
      description: Amount to change per click
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    double_press_action:
      name: Double Press Action
      description: Optional action to run on double press
      default: []
      selector:
        action:

mode: queued
max: 10
max_exceeded: silent

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

variables:
  command: "{{ trigger.event.data.command }}"
  step: !input brightness_step

action:
  - choose:

      # Single Press
      - conditions:
          - condition: template
            value_template: >
              {{ command == 'remote_button_short_press' }}
        sequence:
          - service: light.toggle
            target:
              entity_id: !input light

      # Double Press
      - conditions:
          - condition: template
            value_template: >
              {{ command == 'remote_button_double_press' }}
        sequence: !input double_press_action

      # Rotate Right
      - conditions:
          - condition: template
            value_template: >
              {{ command == 'right' }}
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light
            data:
              brightness_step_pct: !input brightness_step

      # Rotate Left
      - conditions:
          - condition: template
            value_template: >
              {{ command == 'left' }}
        sequence:
          - service: light.turn_on
            target:
              entity_id: !input light
            data:
              brightness_step_pct: >
                {{ step * -1 }}

    default: []
